<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="style.css" />

  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img id="personal-logo" src="/assets/AB-logo-final.png" alt="" />

        <ul class="nav__link--list">

            <a
              href="#"

          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"

          </li>
          <li class="nav__link">
            <a
              href="#"

          <div class="social__list">
            <a href="" class="social__link link">
              <i class="fa-brands fa-linkedin-in social__link--icon click"></i>
            </a>
            <a href="" class="social__link link">
              <i class="fa-brands fa-github social__link--icon click"></i>
            </a>

        </div>

      <button class="mail__btn click">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <a href="#projects" class="scroll">
        <div class="scroll__icon click"></div>
      </a>
